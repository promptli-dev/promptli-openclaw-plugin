name: release
# Tag-driven npm publishing with trusted publishing (OIDC): no npm token is stored in GitHub.
#   v0.1.0 → @promptli-npm/openclaw-plugin@0.1.0 on npm (package.json must carry that version)
# One-time owner setup: on npmjs.com, package settings → Trusted publisher → GitHub Actions,
# repo promptli-dev/promptli-openclaw-plugin, workflow release.yml, environment "npm".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(node -p "require('./package.json').version")
          [ "$got" = "$want" ] || { echo "package.json is $got, tag is $want"; exit 1; }
      - run: npm publish --access public --provenance
